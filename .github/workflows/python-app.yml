name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Tesseract OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

    - name: Download and extract Ollama manually
      run: |
        if [ "${{ runner.arch }}" = "X64" ]; then ARCH="amd64"; else ARCH="arm64"; fi
        curl -fsSL "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" -o ollama.tar.zst
        mkdir -p .ollama-install
        tar -C .ollama-install --zstd -xf ollama.tar.zst
        rm ollama.tar.zst
        echo "$(pwd)/.ollama-install/bin" >> $GITHUB_PATH

    - name: Start Ollama Service and Pull Model
      run: |
        export OLLAMA_NUM_PARALLEL=1
        export OLLAMA_MAX_LOADED_MODELS=1
        ollama serve > ollama.log 2>&1 &
        sleep 5
        ollama pull llama3.2:3b

    - name: Test with pytest and coverage
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pytest -v -m "yaml" \
          --cov=llm_agent.tool_yamlconfig \
          --cov-report=term \
          --cov-report=xml:coverage.xml
        python main.py

    - name: Get coverage percentage
      id: coverage
      working-directory: ./3_1_LLM_agent
      run: |
        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; \
          tree = ET.parse('coverage.xml'); \
          root = tree.getroot(); \
          print(round(float(root.attrib['line-rate']) * 100, 1))")
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "Coverage: $COVERAGE%"

    - name: Update coverage badge
      if: github.ref == 'refs/heads/main'
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 923577a85b9a86a19f8fc7cca120ed2f
        filename: genai-coverage.json
        label: coverage
        message: ${{ env.COVERAGE }}%
        valColorRange: ${{ env.COVERAGE }}
        minColorRange: 0
        maxColorRange: 100
